plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kanju.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kanju.player'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    // 零第三方依赖：MediaPlayer + TextureView + ListView/SeekBar 全为 Framework 原生控件
}
